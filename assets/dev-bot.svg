<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" width="420" height="400" role="img" aria-label="Animated dev bot that codes and deploys">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27365f"/>
      <stop offset="1" stop-color="#131c38"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <clipPath id="barClip">
      <rect x="166" y="290" width="88" height="8" rx="4"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .box { transform-box: fill-box; transform-origin: center; }

    .bot { animation: bob 3.6s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    .shadow { transform-box: fill-box; transform-origin: center; animation: shadow 3.6s ease-in-out infinite; }
    @keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: 0.30; } 50% { transform: scaleX(0.84); opacity: 0.18; } }

    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s ease-in-out infinite; }
    @keyframes blink { 0%, 44%, 50%, 100% { transform: scaleY(1); } 47% { transform: scaleY(0.1); } }

    .beacon { animation: beacon 1.6s ease-in-out infinite; }
    @keyframes beacon { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 1.6s ease-out infinite; }
    @keyframes ring { from { transform: scale(0.6); opacity: 0.8; } to { transform: scale(2.4); opacity: 0; } }

    .wave-arm { transform-box: fill-box; transform-origin: 12% 88%; animation: wave 2.4s ease-in-out infinite; }
    @keyframes wave { 0%, 60%, 100% { transform: rotate(0deg); } 15%, 45% { transform: rotate(-22deg); } 30% { transform: rotate(8deg); } }

    .fill { animation: load 3.2s ease-in-out infinite; }
    @keyframes load { 0% { transform: translateX(-88px); } 70%, 100% { transform: translateX(0); } }

    .chip { animation: float 5s ease-in-out infinite; }
    .c2 { animation-delay: -1.2s; animation-duration: 5.6s; }
    .c3 { animation-delay: -2.4s; animation-duration: 4.6s; }
    .c4 { animation-delay: -3.3s; animation-duration: 6.2s; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

    .gear { transform-box: fill-box; transform-origin: center; animation: spin 7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .orbit { fill: none; stroke: #818cf8; stroke-opacity: 0.35; stroke-width: 1.5; stroke-dasharray: 3 9; animation: dash 20s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -240; } }
  </style>

  <!-- orbit ring -->
  <ellipse class="orbit" cx="210" cy="212" rx="186" ry="150"/>

  <!-- ground shadow -->
  <ellipse class="shadow" cx="210" cy="372" rx="92" ry="11" fill="#6366f1"/>

  <!-- floating chips -->
  <g class="chip">
    <rect x="18" y="92" width="72" height="40" rx="12" fill="#131c38" stroke="url(#neon)" stroke-width="2"/>
    <text class="sans" x="54" y="119" text-anchor="middle" font-size="19" font-weight="800" fill="#67e8f9">AI</text>
  </g>
  <g class="chip c2">
    <rect x="326" y="70" width="78" height="40" rx="12" fill="#131c38" stroke="url(#neon)" stroke-width="2"/>
    <text class="mono" x="365" y="96" text-anchor="middle" font-size="17" font-weight="700" fill="#c4b5fd">{ api }</text>
  </g>
  <g class="chip c3">
    <rect x="12" y="250" width="70" height="46" rx="12" fill="#131c38" stroke="url(#neon)" stroke-width="2"/>
    <!-- cloud -->
    <path d="M33 283 h28 a9 9 0 0 0 1 -18 a13 13 0 0 0 -25 -3 a10.5 10.5 0 0 0 -4 21 z" fill="#67e8f9"/>
    <path d="M47 280 v-11 m-4.5 4.5 l4.5 -4.5 l4.5 4.5" fill="none" stroke="#131c38" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="chip c4">
    <rect x="340" y="246" width="62" height="54" rx="12" fill="#131c38" stroke="url(#neon)" stroke-width="2"/>
    <g class="gear">
      <path fill="#c4b5fd" d="M371 255 l4 0 l1.2 5.2 a13 13 0 0 1 3.6 1.5 l4.5 -2.8 l2.8 2.8 l-2.8 4.5 a13 13 0 0 1 1.5 3.6 l5.2 1.2 l0 4 l-5.2 1.2 a13 13 0 0 1 -1.5 3.6 l2.8 4.5 l-2.8 2.8 l-4.5 -2.8 a13 13 0 0 1 -3.6 1.5 l-1.2 5.2 l-4 0 l-1.2 -5.2 a13 13 0 0 1 -3.6 -1.5 l-4.5 2.8 l-2.8 -2.8 l2.8 -4.5 a13 13 0 0 1 -1.5 -3.6 l-5.2 -1.2 l0 -4 l5.2 -1.2 a13 13 0 0 1 1.5 -3.6 l-2.8 -4.5 l2.8 -2.8 l4.5 2.8 a13 13 0 0 1 3.6 -1.5 z"/>
      <circle cx="373" cy="273" r="5.5" fill="#131c38"/>
    </g>
  </g>

  <!-- the bot -->
  <g class="bot">
    <!-- antenna -->
    <line x1="210" y1="76" x2="210" y2="50" stroke="#818cf8" stroke-width="5" stroke-linecap="round"/>
    <circle class="ring" cx="210" cy="42" r="9" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <circle class="beacon" cx="210" cy="42" r="9" fill="#22d3ee"/>

    <!-- ears -->
    <rect x="96" y="118" width="18" height="46" rx="8" fill="#818cf8"/>
    <rect x="306" y="118" width="18" height="46" rx="8" fill="#818cf8"/>

    <!-- head -->
    <rect x="110" y="76" width="200" height="132" rx="36" fill="url(#shell)" stroke="url(#neon)" stroke-width="4"/>
    <rect x="130" y="98" width="160" height="88" rx="24" fill="#070b1a"/>
    <!-- eyes -->
    <rect class="eye" x="160" y="120" width="26" height="34" rx="13" fill="#22d3ee"/>
    <rect class="eye" x="234" y="120" width="26" height="34" rx="13" fill="#22d3ee"/>
    <circle cx="168" cy="130" r="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="242" cy="130" r="4" fill="#ffffff" opacity="0.9"/>
    <!-- smile -->
    <path d="M194 166 q16 12 32 0" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>

    <!-- neck -->
    <rect x="190" y="208" width="40" height="16" rx="6" fill="#818cf8"/>

    <!-- left arm -->
    <rect x="100" y="238" width="32" height="74" rx="16" fill="url(#shell)" stroke="url(#neon)" stroke-width="4"/>
    <!-- right arm (waving) -->
    <g class="wave-arm">
      <rect x="288" y="184" width="32" height="78" rx="16" fill="url(#shell)" stroke="url(#neon)" stroke-width="4" transform="rotate(28 304 262)"/>
      <circle cx="343" cy="186" r="15" fill="#22d3ee"/>
    </g>

    <!-- body -->
    <rect x="132" y="222" width="156" height="118" rx="30" fill="url(#shell)" stroke="url(#neon)" stroke-width="4"/>
    <rect x="152" y="240" width="116" height="72" rx="14" fill="#070b1a"/>
    <text class="mono" x="210" y="275" text-anchor="middle" font-size="28" font-weight="700" fill="#67e8f9">&lt;/&gt;</text>
    <!-- deploy progress -->
    <rect x="166" y="290" width="88" height="8" rx="4" fill="#1f2a4d"/>
    <g clip-path="url(#barClip)">
      <rect class="fill" x="166" y="290" width="88" height="8" rx="4" fill="url(#bar)"/>
    </g>

    <!-- feet -->
    <rect x="152" y="336" width="44" height="22" rx="11" fill="#818cf8"/>
    <rect x="224" y="336" width="44" height="22" rx="11" fill="#818cf8"/>
  </g>
</svg>
