<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="Thanks for visiting - let's build and ship something">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3350"/>
      <stop offset="0.5" stop-color="#101a3c"/>
      <stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <clipPath id="card">
      <rect width="1200" height="120" rx="22"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .wave-1 { animation: slide 14s linear infinite; }
    .wave-2 { animation: slide 22s linear infinite reverse; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="120" fill="url(#bg)"/>
    <path class="wave-1" fill="url(#wave)" fill-opacity="0.20"
          d="M0 86 C150 66 300 106 450 86 S750 66 900 86 S1050 106 1200 86 C1350 66 1500 106 1650 86 S1950 66 2100 86 S2250 106 2400 86 V120 H0 Z"/>
    <path class="wave-2" fill="url(#wave)" fill-opacity="0.14"
          d="M0 98 C200 82 400 114 600 98 S1000 82 1200 98 C1400 82 1600 114 1800 98 S2200 82 2400 98 V120 H0 Z"/>
    <text class="mono pulse" x="600" y="56" text-anchor="middle" font-size="19" font-weight="600" fill="#e0e7ff">Thanks for visiting. Let's build and ship something.</text>
  </g>
</svg>
