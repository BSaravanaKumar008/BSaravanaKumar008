<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="B. Saravana Kumar - AI Full Stack Engineer - Development to Deployment">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.55" stop-color="#101a3c"/>
      <stop offset="1" stop-color="#0b3350"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <clipPath id="card">
      <rect width="1200" height="300" rx="22"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

    .glow-a { animation: driftA 14s ease-in-out infinite alternate; }
    .glow-b { animation: driftB 18s ease-in-out infinite alternate; }
    @keyframes driftA { from { transform: translate(0, 0); } to { transform: translate(120px, 30px); } }
    @keyframes driftB { from { transform: translate(0, 0); } to { transform: translate(-140px, -24px); } }

    .rise { opacity: 0; animation: rise 0.9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: 0.15s; }
    .d2 { animation-delay: 0.40s; }
    .d3 { animation-delay: 0.65s; }
    .d4 { animation-delay: 0.95s; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -14; } }

    .stage rect { fill: #ffffff; fill-opacity: 0.06; stroke: #ffffff; stroke-opacity: 0.22; animation: stage 6s ease-in-out infinite; }
    .stage text { fill: #c7d2fe; animation: stageText 6s ease-in-out infinite; }
    .s1 rect, .s1 text { animation-delay: 0s; }
    .s2 rect, .s2 text { animation-delay: 1.2s; }
    .s3 rect, .s3 text { animation-delay: 2.4s; }
    .s4 rect, .s4 text { animation-delay: 3.6s; }
    .s5 rect, .s5 text { animation-delay: 4.8s; }
    @keyframes stage {
      0%, 22%, 100% { fill: #ffffff; fill-opacity: 0.06; stroke: #ffffff; stroke-opacity: 0.22; }
      6%, 16% { fill: #22d3ee; fill-opacity: 0.22; stroke: #22d3ee; stroke-opacity: 1; }
    }
    @keyframes stageText {
      0%, 22%, 100% { fill: #c7d2fe; }
      6%, 16% { fill: #ffffff; }
    }

    .wave-1 { animation: slide 16s linear infinite; }
    .wave-2 { animation: slide 24s linear infinite reverse; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-1200px); } }

    .star { animation: twinkle 3.2s ease-in-out infinite; }
    .t2 { animation-delay: 0.8s; } .t3 { animation-delay: 1.6s; } .t4 { animation-delay: 2.4s; }
    @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.9; } }

    .underline { transform-box: fill-box; transform-origin: center; animation: underline 3.2s ease-in-out infinite; }
    @keyframes underline { 0%, 100% { transform: scaleX(0.35); opacity: 0.6; } 50% { transform: scaleX(1); opacity: 1; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- soft moving glows -->
    <circle class="glow-a" cx="210" cy="60" r="130" fill="#22d3ee" opacity="0.28" filter="url(#blur)"/>
    <circle class="glow-b" cx="1010" cy="250" r="150" fill="#a855f7" opacity="0.26" filter="url(#blur)"/>

    <!-- twinkling points -->
    <g fill="#e0f2fe">
      <circle class="star" cx="96" cy="92" r="2"/>
      <circle class="star t2" cx="188" cy="214" r="1.6"/>
      <circle class="star t3" cx="318" cy="48" r="1.8"/>
      <circle class="star t4" cx="902" cy="56" r="2"/>
      <circle class="star t2" cx="1046" cy="118" r="1.6"/>
      <circle class="star t3" cx="1124" cy="196" r="2"/>
      <circle class="star" cx="1088" cy="40" r="1.4"/>
      <circle class="star t4" cx="64" cy="172" r="1.6"/>
    </g>

    <!-- bottom waves -->
    <g opacity="0.55">
      <path class="wave-1" fill="url(#wave)" fill-opacity="0.22"
            d="M0 272 C150 252 300 292 450 272 S750 252 900 272 S1050 292 1200 272 C1350 252 1500 292 1650 272 S1950 252 2100 272 S2250 292 2400 272 V300 H0 Z"/>
      <path class="wave-2" fill="url(#wave)" fill-opacity="0.16"
            d="M0 282 C200 266 400 298 600 282 S1000 266 1200 282 C1400 266 1600 298 1800 282 S2200 266 2400 282 V300 H0 Z"/>
    </g>

    <!-- heading -->
    <text class="mono rise d1" x="600" y="62" text-anchor="middle" font-size="15" letter-spacing="4" fill="#67e8f9">&lt; HELLO, WORLD /&gt;</text>
    <text class="sans rise d2" x="600" y="122" text-anchor="middle" font-size="56" font-weight="800" letter-spacing="-0.5" fill="#ffffff">B. Saravana Kumar</text>
    <g class="rise d3">
      <text class="sans" x="600" y="168" text-anchor="middle" font-size="28" font-weight="700" fill="url(#accent)">AI Full Stack Engineer</text>
      <rect class="underline" x="480" y="181" width="240" height="3" rx="1.5" fill="url(#accent)"/>
    </g>

    <!-- development to deployment pipeline -->
    <g class="rise d4">
      <g fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round">
        <path class="flow" d="M338 226 H382"/>
        <path class="flow" d="M498 226 H542"/>
        <path class="flow" d="M658 226 H702"/>
        <path class="flow" d="M818 226 H862"/>
      </g>
      <g class="mono" font-size="15" font-weight="600" text-anchor="middle">
        <g class="stage s1"><rect x="222" y="207" width="116" height="38" rx="19" stroke-width="1.5"/><text x="280" y="231">Code</text></g>
        <g class="stage s2"><rect x="382" y="207" width="116" height="38" rx="19" stroke-width="1.5"/><text x="440" y="231">Build</text></g>
        <g class="stage s3"><rect x="542" y="207" width="116" height="38" rx="19" stroke-width="1.5"/><text x="600" y="231">Test</text></g>
        <g class="stage s4"><rect x="702" y="207" width="116" height="38" rx="19" stroke-width="1.5"/><text x="760" y="231">Deploy</text></g>
        <g class="stage s5"><rect x="862" y="207" width="116" height="38" rx="19" stroke-width="1.5"/><text x="920" y="231">Monitor</text></g>
      </g>
    </g>
  </g>
</svg>
